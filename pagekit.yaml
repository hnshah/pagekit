# pagekit.yaml — canonical method manifest
#
# Single source of truth for the PageKit method. Scripts, skills, agents
# and the guides all read from here. Edit this file to change the method;
# everything downstream follows.
#
# Every file path is relative to the repo root.

version: "0.2"
name: PageKit
description: A system for producing better pages by strengthening the source materials that shape the copy.

# Canonical entry points for agents. The order here is the order an agent
# reading the repo cold should follow.
entry_points:
  agent_contract: AGENTS.md         # Codex-first, Claude-Code-compatible
  claude_specific: CLAUDE.md        # Claude Code contract (more detailed)
  human_first_time: START-HERE.md
  full_overview: README.md

# Directory conventions.
paths:
  frameworks: frameworks/
  templates: templates/
  guides: guides/
  quickstart: quickstart/
  agentic: agentic/
  guided_runs: guided-runs/
  runs: runs/
  prompts: prompts/
  scripts: scripts/
  skills: .claude/skills/

# The canonical method. Steps run in number order.
# Steps 01–06 are required. Step 07 is an optional durability pass.
method:
  steps:
    - number: "01"
      name: signal-doc
      title: Build a Signal Doc
      artifact: signal-doc.md
      framework: frameworks/signal-doc.md
      template: templates/signal-doc-template.md
      guided_run: guided-runs/01-build-signal-doc/README.md
      prompt: prompts/01-signal-doc.md
      required: true
      inputs:
        - product-brief (or raw product description)
      outputs:
        - signal-doc.md

    - number: "02"
      name: message-spine
      title: Reduce to a Message Spine
      artifact: message-spine.md
      framework: frameworks/message-spine.md
      template: templates/message-spine-template.md
      guided_run: guided-runs/02-reduce-to-message-spine/README.md
      prompt: prompts/02-message-spine.md
      required: true
      inputs:
        - signal-doc.md
      outputs:
        - message-spine.md

    - number: "03"
      name: first-page-decision
      title: Decide the First Page
      artifact: first-page-decision.md
      framework: frameworks/first-page-decision.md
      template: templates/first-page-decision-template.md
      guided_run: guided-runs/03-decide-first-page/README.md
      prompt: prompts/03-first-page-decision.md
      required: true
      inputs:
        - signal-doc.md
        - message-spine.md
      outputs:
        - first-page-decision.md
      notes: |
        Does NOT default to homepage. The object decides. The decision
        must list candidates considered and rejected.

    - number: "04"
      name: page-argument-shape
      title: Design the Page Argument Shape
      artifact: page-argument-shape.md
      framework: frameworks/page-argument-shape.md
      template: templates/page-argument-shape-template.md
      guided_run: guided-runs/04-design-page-argument/README.md
      prompt: prompts/04-page-argument-shape.md
      required: true
      inputs:
        - first-page-decision.md
      outputs:
        - page-argument-shape.md

    - number: "05"
      name: proof-map
      title: Map Proof to the Page
      artifact: proof-map.md
      framework: frameworks/proof-map.md
      template: templates/proof-map-template.md
      guided_run: guided-runs/05-map-proof-to-pages/README.md
      prompt: prompts/05-proof-map.md
      required: true
      inputs:
        - first-page-decision.md
        - page-argument-shape.md
      outputs:
        - proof-map.md

    - number: "06"
      name: first-page-draft
      title: Draft the First Page
      artifact: first-page-draft.md
      framework: frameworks/page-argument-shape.md  # drafting constraints live here
      template: templates/page-argument-shape-template.md
      guided_run: guided-runs/06-draft-first-page/README.md
      prompt: prompts/06-first-page-draft.md
      required: true
      inputs:
        - signal-doc.md
        - message-spine.md
        - first-page-decision.md
        - page-argument-shape.md
        - proof-map.md
      outputs:
        - first-page-draft.md
      notes: |
        The draft must respect the anti-slop constraints in
        frameworks/anti-slop.md. Unverified product claims get
        inline *[verification flag: ...]* markers.

    - number: "07"
      name: claim-check
      title: Claim Check (optional durability pass)
      artifact: claim-check.md
      framework: frameworks/claim-checking.md
      template: templates/claim-check-template.md
      guided_run: guided-runs/07-claim-check/README.md
      prompt: prompts/07-claim-check.md
      required: false
      severity_options: [light, normal, hard]
      default_severity: normal
      inputs:
        - first-page-draft.md
        - proof-map.md
      outputs:
        - claim-check.md
        - first-page-draft-corrected.md   # optional; produced if any line was flagged

# Anti-slop rule reference.
anti_slop:
  framework: frameworks/anti-slop.md
  script: scripts/slop-check.sh

# Run-logging tiers (see frameworks/run-logging.md).
run_logging:
  framework: frameworks/run-logging.md
  tiers:
    fully_logged:
      required_files:
        - goal.md
        - working-log.md
        - models.md
        - sources/                   # directory with source briefs
        - prompts/                   # one file per step, NN-*.md
        - outputs/                   # one file per step, NN-*-output.md
        - evaluation.md
        - evaluator-pass.md
      required_artifacts:
        - signal-doc.md
        - message-spine.md
        - first-page-decision.md
        - page-argument-shape.md
        - proof-map.md
        - first-page-draft.md
    summary_logged:
      required_files:
        - goal.md
        - working-log.md
        - models.md
        - evaluation.md
      required_artifacts:
        - signal-doc.md
        - message-spine.md
        - first-page-decision.md
        - page-argument-shape.md
        - proof-map.md
        - first-page-draft.md

# Tooling.
tooling:
  scripts:
    - path: scripts/new-run.sh
      description: Scaffold a fully-logged run folder.
      usage: scripts/new-run.sh <run-name>
    - path: scripts/run-check.sh
      description: Validate a run against the fully-logged / summary-logged tier.
      usage: scripts/run-check.sh <run-path>
    - path: scripts/claim-check.sh
      description: Template-expand a claim-check prompt for paste.
      usage: scripts/claim-check.sh <draft-path> <proof-map-path> [--severity hard|normal|light]
    - path: scripts/slop-check.sh
      description: Heuristic regression check for AI-slop patterns.
      usage: scripts/slop-check.sh [<file-or-dir>...]
    - path: scripts/doctor.sh
      description: Repo health pre-flight check.
      usage: scripts/doctor.sh
  make_targets:
    - make new-run NAME=<name>
    - make run-check RUN=<name>
    - make slop-check
    - make claim-check DRAFT=<path> PROOF=<path> [SEVERITY=hard|normal|light]
    - make doctor
    - make help

# Agentic surfaces.
agentic:
  claude_code:
    path: agentic/claude-code-agentic-path.md
    skills_dir: .claude/skills/
    subagents_dir: .claude/agents/
    settings: .claude/settings.json
  codex:
    path: agentic/codex-agentic-path.md
    contract: AGENTS.md
  claude_cowork:
    path: agentic/claude-cowork-agentic-path.md
    plugin_body: .claude/skills/
    plugin_reference: https://github.com/anthropics/knowledge-work-plugins
